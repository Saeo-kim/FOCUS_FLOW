<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- FOCUS FLOW app icon (master). Three task streams of descending priority converge into one focus point. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262D72"/>
      <stop offset="0.55" stop-color="#1A1950"/>
      <stop offset="1" stop-color="#110E33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#9F7AEA"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="35" y="35" width="954" height="954" rx="221" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <g fill="none" stroke-linecap="round" stroke="url(#flow)" stroke-width="66">
    <path d="M220 316 H420 C548 316 560 512 660 512" />
    <path d="M300 512 H660" stroke-opacity="0.8"/>
    <path d="M380 708 H420 C548 708 560 512 660 512" stroke-opacity="0.6"/>
  </g>
  <circle cx="742" cy="512" r="112" fill="#1A1950" stroke="#C4B5FD" stroke-width="30"/>
  <circle cx="742" cy="512" r="60" fill="#FFFFFF"/>
</svg>
