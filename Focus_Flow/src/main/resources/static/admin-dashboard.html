<!DOCTYPE html>
<!--
    ADMIN workspace, served at /admin (and /admin-dashboard) to administrators only.
    It reuses index.html's layout and every original page through the same app.js and workspace.js,
    plus shell.js (session, bell, account) and admin.js (management pages). index.html itself is unchanged.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCUS FLOW · Admin</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1A1950">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FOCUS FLOW">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/shell.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/ai-team.css">
    <link rel="stylesheet" href="/css/legal.css">
    <link rel="stylesheet" href="/css/security.css">
</head>

<body class="admin-edition">
<div class="app">
    <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/admin" aria-label="FOCUS FLOW admin home">
            <img class="brand-mark" src="/favicon.svg" alt="" width="42" height="42">
            <span class="brand-name">FOCUS FLOW</span>
        </a>
        <nav id="nav" aria-label="Main"></nav>
        <div class="sidebar-foot" id="workspaceName"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
        <header class="topbar">
            <button class="icon-btn menu-btn" id="menuButton" type="button" aria-label="Open menu"></button>
            <h2 class="page-title" id="pageTitle"></h2>
            <div class="date" id="today"></div>
            <div class="topbar-actions" id="topbarActions">
                <div class="pop-anchor">
                    <button class="icon-btn topbar-btn" id="bellButton" type="button" aria-label="Notifications"
                            aria-haspopup="true" aria-expanded="false" aria-controls="bellPanel"></button>
                    <div class="popover bell-panel" id="bellPanel" hidden></div>
                </div>
                <div class="pop-anchor">
                    <button class="avatar-btn" id="profileButton" type="button" aria-label="Account"
                            aria-haspopup="true" aria-expanded="false" aria-controls="profilePanel"></button>
                    <div class="popover profile-panel" id="profilePanel" hidden></div>
                </div>
            </div>
        </header>

        <main class="content" id="view"></main>

        <footer>FOCUS ON WHAT MATTERS · FOCUS FLOW · ADMIN</footer>
    </div>
</div>

<dialog class="modal" id="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/js/app.js"></script>
<script src="/js/workspace.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/discussion.js"></script>
<script src="/js/ai-team.js"></script>
<script src="/js/legal.js"></script>
<script src="/js/security.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
