spring.application.name=project-flow

spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:8181}/${DB_NAME:focus_flow}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
