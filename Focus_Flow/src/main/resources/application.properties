spring.application.name=project-flow

spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:focus_flow}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Only this PC can open FOCUS FLOW. Remove this line to allow other devices on the network.
server.address=${SERVER_ADDRESS:127.0.0.1}

# AI teammates. Owner's Office (CFO) runs as its own app on this PC. The token is a secret:
# set OWNERS_OFFICE_TOKEN (the same value as OFFICE_AGENT_TOKEN there) or put it in application-local.properties.
# Without a token the CFO still appears in the member list, but nothing is sent to it.
owners-office.base-url=${OWNERS_OFFICE_URL:http://127.0.0.1:4320}
owners-office.token=${OWNERS_OFFICE_TOKEN:}
owners-office.sync-interval-ms=60000
